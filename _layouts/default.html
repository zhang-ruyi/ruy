<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <style>
    body { max-width: 820px; margin: 40px auto; padding: 0 20px;
           font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
           line-height: 1.7; color: #1c2531; }
    header { border-bottom: 1px solid #e3e8ee; padding-bottom: 12px; margin-bottom: 28px; }
    header a { color: #1a6fd0; text-decoration: none; font-weight: 600; }
    a { color: #1a6fd0; }
    ul { padding-left: 1.2em; }
  </style>
</head>
<body>
  <header><a href="{{ '/' | relative_url }}">{{ site.title }}</a></header>
  <main>{{ content }}</main>
</body>
</html>
