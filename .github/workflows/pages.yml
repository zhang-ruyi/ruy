name: Deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 可选:每天自动跟随子项目最新 main
  # schedule:
  #   - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # 取消注释即可在每次构建时自动使用子项目远端 main 的最新提交
      # - run: git submodule update --remote --merge subprojects/linux-arch-dia

      # 把子项目产物放进 Jekyll 源目录,构建时由 Jekyll 原样拷贝到 _site
      # (Jekyll 的 Docker action 以 root 生成 _site,构建后再写入会无权限)
      - name: Stage linux-arch-dia
        run: |
          rm -rf linux-arch-dia
          mkdir -p linux-arch-dia
          rsync -a subprojects/linux-arch-dia/site/ linux-arch-dia/

      # enablement 需要非 GITHUB_TOKEN 的 PAT,故不启用;
      # 请先在 Settings → Pages → Source 选择 GitHub Actions。
      - uses: actions/configure-pages@v6

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
